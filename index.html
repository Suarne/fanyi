<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="文言文翻译真题练习：79 道高考真题（2016—2026），配参考译文、采分点解析、AI 批改与云端错题本。">
<title>文言翻译研习 · 真题精练</title>
<style>
:root{
  --paper:oklch(.975 .012 85);--paper-raised:oklch(.992 .006 85);--paper-deep:oklch(.94 .025 82);
  --ink:oklch(.27 .025 65);--ink-soft:oklch(.43 .025 65);--muted:oklch(.50 .022 65);
  --cinnabar:oklch(.48 .13 32);--cinnabar-dark:oklch(.39 .11 32);--cinnabar-soft:oklch(.93 .035 35);
  --pine:oklch(.40 .07 155);--pine-soft:oklch(.93 .025 150);--gold:oklch(.53 .09 75);
  --line:oklch(.86 .025 80);--line-dark:oklch(.73 .035 75);--shadow:0 18px 50px oklch(.30 .03 60/.08);
  --serif:"STSong","Songti SC","Noto Serif CJK SC","SimSun",serif;
  --kai:"STKaiti","KaiTi","Kaiti SC",serif;
  --sans:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-width:320px;min-height:100dvh;color:var(--ink);background:var(--paper);font:16px/1.7 var(--sans);-webkit-font-smoothing:antialiased;background-image:radial-gradient(oklch(.55 .04 70/.055) .65px,transparent .65px);background-size:7px 7px}
button,input{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
button,a,input,summary{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
[hidden]{display:none!important}
h1,h2,h3,p{margin-top:0}
h1,h2,h3{font-family:var(--serif);line-height:1.3}
svg{display:block}
.shell{width:min(1180px,100%);margin-inline:auto;padding-inline:24px}
.site-header{position:sticky;top:0;z-index:20;background:oklch(.975 .012 85/.94);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}
.header-inner{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:12px;border:0;background:none;color:var(--ink);padding:6px 0;text-align:left;min-height:52px}
.brand-seal{display:grid;place-items:center;width:42px;height:42px;background:var(--cinnabar);color:var(--paper-raised);font:25px/1 var(--kai);border-radius:4px;box-shadow:inset 0 0 0 2px oklch(.98 .01 80/.35)}
.brand-name{display:block;font:700 19px/1.3 var(--serif);letter-spacing:.08em}
.brand-sub{display:block;color:var(--muted);font-size:11px;letter-spacing:.14em;margin-top:3px}
.header-actions{display:flex;align-items:center;gap:8px}
.nav-button,.text-button{border:0;background:transparent;color:var(--ink-soft);min-height:44px;padding:8px 12px;border-radius:6px;transition:background .18s,color .18s}
.nav-button:hover,.text-button:hover{background:var(--paper-deep);color:var(--cinnabar-dark)}
.nav-button.active{color:var(--cinnabar);background:var(--cinnabar-soft)}
.user-button{border-left:1px solid var(--line);border-radius:0;margin-left:4px;padding-left:16px;color:var(--muted);font-size:13px}
main{min-height:calc(100dvh - 140px)}
.view{padding-block:48px 64px;animation:enter .22s ease-out}
@keyframes enter{from{opacity:.4;transform:scale(.995)}to{opacity:1;transform:scale(1)}}
.welcome-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(340px,.85fr);gap:72px;align-items:center;min-height:calc(100dvh - 220px)}
.eyebrow{display:flex;align-items:center;gap:10px;color:var(--cinnabar);font-size:13px;font-weight:700;letter-spacing:.18em;margin-bottom:20px}
.eyebrow:before{content:"";width:28px;height:1px;background:var(--cinnabar)}
.hero-title{font-size:clamp(38px,5.4vw,68px);font-weight:600;letter-spacing:.04em;margin-bottom:22px;max-width:9em}
.hero-title em{font-family:var(--kai);font-style:normal;color:var(--cinnabar)}
.hero-copy{max-width:34em;color:var(--ink-soft);font-size:17px;line-height:1.9;margin-bottom:30px}
.classic-quote{border-left:2px solid var(--cinnabar);padding-left:18px;color:var(--muted);font:18px/1.8 var(--kai)}
.classic-quote small{display:block;font:12px/1.6 var(--sans);margin-top:5px;letter-spacing:.08em}
.paper-panel{background:var(--paper-raised);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
.login-panel{padding:34px;position:relative}
.login-panel:after{content:"习";position:absolute;right:24px;top:22px;width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--cinnabar);color:var(--cinnabar);font:23px var(--kai);transform:rotate(3deg);border-radius:3px}
.panel-kicker{font-size:12px;color:var(--muted);letter-spacing:.14em;margin-bottom:8px}
.login-panel h2{font-size:26px;margin-bottom:10px;max-width:85%}
.panel-copy{font-size:14px;color:var(--muted);margin-bottom:26px}
.field-label{display:block;font-weight:700;font-size:14px;margin-bottom:8px}
.name-input{width:100%;min-height:50px;border:1px solid var(--line-dark);background:var(--paper);color:var(--ink);border-radius:6px;padding:10px 14px;outline:none;transition:border-color .18s,box-shadow .18s}
.name-input:focus{border-color:var(--cinnabar);box-shadow:0 0 0 3px var(--cinnabar-soft)}
.name-input[aria-invalid="true"]{border-color:var(--cinnabar)}
.field-error{min-height:24px;color:var(--cinnabar-dark);font-size:13px;margin:5px 0 8px}
.primary-button,.secondary-button{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:46px;border-radius:6px;padding:10px 20px;font-weight:700;letter-spacing:.04em;transition:background .18s,transform .18s,border-color .18s}
.primary-button{background:var(--cinnabar);color:var(--paper-raised);border:1px solid var(--cinnabar)}
.primary-button:hover:not(:disabled){background:var(--cinnabar-dark);border-color:var(--cinnabar-dark)}
.primary-button:active:not(:disabled),.secondary-button:active:not(:disabled){transform:translateY(1px)}
.primary-button:disabled{background:var(--line-dark);border-color:var(--line-dark);color:var(--paper-raised)}
.secondary-button{background:transparent;color:var(--ink);border:1px solid var(--line-dark)}
.secondary-button:hover{background:var(--paper-deep);border-color:var(--ink-soft)}
.full-width{width:100%}
.login-features{list-style:none;padding:0;margin:24px 0 0;display:grid;gap:12px;font-size:13px;color:var(--ink-soft)}
.login-features li{display:flex;align-items:center;gap:10px}
.feature-number{display:grid;place-items:center;width:24px;height:24px;border:1px solid var(--line);border-radius:50%;font:14px var(--kai);color:var(--cinnabar);flex:none}
.offline-note{display:flex;gap:9px;align-items:flex-start;margin-top:22px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.offline-note svg{flex:none;margin-top:3px}
.page-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:30px}
.page-heading h1{font-size:34px;margin-bottom:8px}
.page-heading p{color:var(--muted);margin:0}
.heading-note{font:16px var(--kai);color:var(--cinnabar);white-space:nowrap}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);border-block:1px solid var(--line);margin-bottom:32px}
.stat{padding:22px 24px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat-value{display:block;font:34px/1.2 var(--serif);color:var(--ink)}
.stat-value.accent{color:var(--cinnabar)}
.stat-label{display:block;font-size:12px;color:var(--muted);margin-top:6px;letter-spacing:.08em}
.review-entry{width:100%;display:flex;align-items:center;gap:16px;text-align:left;padding:20px 22px;background:var(--ink);color:var(--paper);border:1px solid var(--ink);border-radius:8px;margin-bottom:36px;transition:background .18s}
.review-entry:hover{background:var(--cinnabar-dark);border-color:var(--cinnabar-dark)}
.review-icon{display:grid;place-items:center;width:44px;height:44px;border:1px solid oklch(.98 .01 80/.25);border-radius:50%;font:22px var(--kai);flex:none}
.review-text{flex:1}
.review-text strong{display:block;font-family:var(--serif);font-size:18px}
.review-text small{color:var(--paper-deep);font-size:12px}
.review-count{font:24px var(--serif)}
.group-section{margin-bottom:34px}
.group-heading{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.group-heading h2{font-size:20px;margin:0}
.group-heading span{font-size:12px;color:var(--muted)}
.question-list{border-top:1px solid var(--line-dark)}
.question-row{display:grid;grid-template-columns:48px minmax(0,1fr) auto 24px;align-items:center;gap:16px;width:100%;min-height:82px;padding:14px 12px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);text-align:left;transition:background .18s}
.question-row:hover{background:var(--paper-raised)}
.question-number{font:22px var(--serif);color:var(--muted);text-align:center}
.question-main strong{display:block;font:17px var(--serif);margin-bottom:3px}
.question-main small{display:block;color:var(--muted);font:14px var(--kai);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status-badge{font-size:12px;padding:3px 9px;border:1px solid var(--line);border-radius:20px;color:var(--muted);white-space:nowrap}
.status-badge.done{color:var(--pine);border-color:var(--pine);background:var(--pine-soft)}
.status-badge.review{color:var(--cinnabar);border-color:var(--cinnabar);background:var(--cinnabar-soft)}
.row-arrow{color:var(--cinnabar);font-size:24px}
.back-button{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--ink-soft);padding:8px 0;min-height:44px;margin-bottom:18px}
.back-button:hover{color:var(--cinnabar)}
.quiz-meta{display:flex;align-items:center;gap:12px;margin-bottom:10px;color:var(--muted);font-size:13px}
.quiz-number{color:var(--cinnabar);font-weight:700}
.quiz-title{font-size:30px;margin-bottom:24px}
.quiz-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;align-items:start}
.quiz-layout.graded{grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr)}
.question-panel{padding:28px}
.instruction{display:flex;justify-content:space-between;gap:16px;align-items:center;color:var(--muted);font-size:13px;margin-bottom:20px}
.instruction strong{color:var(--ink)}
.selection-count{font-variant-numeric:tabular-nums;color:var(--cinnabar);font-weight:700;white-space:nowrap}
.sentence{font:22px/2.35 var(--kai);letter-spacing:.05em;margin-bottom:22px;overflow-wrap:anywhere}
.sentence-text{white-space:normal}
.slot{position:relative;display:inline-flex;flex:none;align-items:center;justify-content:center;width:44px;height:44px;margin:3px 2px;padding:0;border:1px solid var(--line-dark);border-radius:50%;background:var(--paper);color:var(--muted);font:700 13px/1 var(--sans);vertical-align:middle;transition:background .16s,color .16s,border-color .16s,transform .16s}
.slot:hover:not(:disabled){border-color:var(--cinnabar);color:var(--cinnabar);transform:translateY(-1px)}
.slot.selected{background:var(--cinnabar);border-color:var(--cinnabar);color:var(--paper-raised)}
.slot:disabled:not(.hit):not(.miss):not(.extra):not(.selected){opacity:.52}
.slot.hit{background:var(--pine);border-color:var(--pine);color:var(--paper-raised);opacity:1}
.slot.miss{background:var(--pine-soft);border:2px dashed var(--pine);color:var(--pine);opacity:1}
.slot.extra{background:var(--cinnabar-soft);border-color:var(--cinnabar);color:var(--cinnabar-dark);opacity:1;text-decoration:line-through}
.slot.neutral{opacity:.55}
.slot-state{position:absolute;right:-4px;top:-7px;display:grid;place-items:center;min-width:18px;height:18px;padding:0 3px;border-radius:9px;background:var(--paper-raised);color:inherit;font:10px/1 var(--sans);text-decoration:none;border:1px solid currentColor}
.quiz-actions{display:flex;align-items:center;justify-content:space-between;gap:16px;border-top:1px solid var(--line);padding-top:20px}
.quiz-hint{font-size:12px;color:var(--muted)}
.fold{border-top:1px solid var(--line);margin-top:22px}
.fold summary{list-style:none;display:flex;align-items:center;gap:12px;min-height:58px;cursor:pointer;color:var(--ink);padding:10px 2px}
.fold summary::-webkit-details-marker{display:none}
.fold summary:hover .fold-title{color:var(--cinnabar)}
.fold-icon{display:grid;place-items:center;width:30px;height:30px;border:1px solid var(--line-dark);border-radius:4px;font:17px var(--kai);color:var(--cinnabar);flex:none}
.fold-title{font-family:var(--serif);font-weight:700}
.fold-subtitle{font-size:12px;color:var(--muted);flex:1}
.fold-arrow{font-size:18px;color:var(--muted);transition:transform .18s}
.fold[open] .fold-arrow{transform:rotate(180deg)}
.fold-body{padding:0 0 22px;color:var(--ink-soft)}
.passage{font:17px/2 var(--kai);padding:16px 18px;background:var(--paper);border-radius:6px;margin:0}
.passage mark{background:var(--cinnabar-soft);color:var(--cinnabar-dark);padding:2px 0}
.result-panel{padding:28px;background:var(--paper-raised);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);scroll-margin-top:96px}
#variant-fold{scroll-margin-top:80px}
.verdict{display:flex;gap:12px;align-items:center;margin-bottom:18px}
.verdict-mark{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;font:24px var(--kai);background:var(--pine-soft);color:var(--pine);flex:none}
.verdict.wrong .verdict-mark{background:var(--cinnabar-soft);color:var(--cinnabar)}
.verdict h2{font-size:24px;margin:0 0 3px}
.verdict p{font-size:13px;color:var(--muted);margin:0}
.answer-line{padding:12px 14px;background:var(--paper);border-radius:6px;margin-bottom:12px;font-size:14px}
.answer-line strong{color:var(--cinnabar);font-size:18px;letter-spacing:.12em}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin:14px 0 4px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend-dot{width:10px;height:10px;border-radius:50%;background:var(--pine)}
.legend-dot.miss{background:var(--pine-soft);border:1px dashed var(--pine)}
.legend-dot.extra{background:var(--cinnabar-soft);border:1px solid var(--cinnabar)}
.analysis-section{margin-bottom:24px}
.analysis-section h3{font-size:18px;margin-bottom:5px;color:var(--cinnabar-dark)}
.analysis-intro{font-size:12px;color:var(--muted);margin-bottom:14px}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:420px;background:var(--paper-raised)}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--paper-deep);color:var(--ink);font-weight:700;white-space:nowrap}
tr:last-child td{border-bottom:0}
.verb{font-family:var(--kai);font-size:17px;color:var(--cinnabar-dark);font-weight:700}
.marker-list{display:grid;gap:10px}
.marker-item{padding:12px 14px;background:var(--paper);border-radius:6px;font-size:14px}
.marker-item strong{color:var(--cinnabar-dark);font-family:var(--kai);font-size:17px;margin-right:8px}
.translation{font:16px/1.9 var(--kai);padding:14px 16px;border-left:2px solid var(--gold);background:var(--paper);margin-bottom:10px}
.context-note{font-size:14px;color:var(--ink-soft)}
.extension-list{display:grid;gap:14px}
.extension-item h4{font:700 16px var(--serif);margin:0 0 4px}
.extension-item p{font-size:14px;margin:0;color:var(--ink-soft)}
.variant-box{padding-top:4px}
.variant-hint{font-size:13px;color:var(--muted);margin-bottom:16px}
.variant-box .sentence{font-size:20px}
.variant-actions{display:flex;justify-content:space-between;align-items:center;gap:12px}
.variant-result{margin-top:16px}
.empty-state{text-align:center;padding:54px 24px;border:1px dashed var(--line-dark);border-radius:8px;background:var(--paper-raised)}
.empty-seal{width:58px;height:58px;display:grid;place-items:center;margin:0 auto 18px;border:1px solid var(--pine);color:var(--pine);border-radius:50%;font:30px var(--kai)}
.empty-state h2{font-size:24px;margin-bottom:8px}
.empty-state p{color:var(--muted);margin-bottom:22px}
.review-list{display:grid;gap:14px}
.review-item{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:20px;width:100%;padding:20px 22px;text-align:left;border:1px solid var(--line);border-radius:8px;background:var(--paper-raised);color:var(--ink);transition:border-color .18s,transform .18s}
.review-item:hover{border-color:var(--cinnabar);transform:translateY(-1px)}
.review-item-source{font-size:12px;color:var(--cinnabar);margin-bottom:5px}
.review-item-text{font:17px var(--kai);margin-bottom:7px}
.review-item-last{font-size:12px;color:var(--muted)}
.review-redo{font-weight:700;color:var(--cinnabar);white-space:nowrap}
.site-footer{border-top:1px solid var(--line);color:var(--muted);font-size:12px}
.footer-inner{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.toast{position:fixed;left:50%;bottom:24px;z-index:40;transform:translateX(-50%);max-width:min(520px,calc(100% - 32px));padding:12px 18px;background:var(--ink);color:var(--paper);border-radius:6px;box-shadow:var(--shadow);font-size:14px}
.storage-notice{margin-bottom:20px;padding:12px 16px;background:var(--cinnabar-soft);color:var(--cinnabar-dark);border:1px solid var(--cinnabar);border-radius:6px;font-size:13px}
textarea{font:inherit}
.translation-input{display:block;width:100%;min-height:150px;resize:vertical;border:1px solid var(--line-dark);border-radius:6px;background:var(--paper);color:var(--ink);padding:12px 14px;line-height:1.8;outline:none}
.translation-input:focus{border-color:var(--cinnabar);box-shadow:0 0 0 3px var(--cinnabar-soft)}
.translation-input[aria-invalid="true"]{border-color:var(--cinnabar)}
.input-meta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px;margin-top:6px}
.privacy-note{font-size:12px;color:var(--muted);margin:12px 0}
.ai-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.ai-error{padding:10px 12px;border-left:2px solid var(--cinnabar);background:var(--cinnabar-soft);color:var(--cinnabar-dark);font-size:13px;margin-top:12px}
.ai-result{border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:24px}
.score-line{display:flex;align-items:baseline;gap:8px;margin:10px 0}.score-value{font:44px/1.2 var(--serif);color:var(--cinnabar)}
.ai-disclaimer,.cloud-muted{font-size:12px;color:var(--muted)}
.point-status{display:inline-block;border-radius:12px;padding:1px 8px;font-size:12px;margin-right:8px;background:var(--paper-deep)}
.point-status.correct{color:var(--pine);background:var(--pine-soft)}.point-status.partial{color:var(--gold)}.point-status.missed{color:var(--cinnabar);background:var(--cinnabar-soft)}
.cloud-banner{padding:16px 18px;margin-bottom:20px;border:1px solid var(--cinnabar);background:var(--cinnabar-soft);border-radius:8px}
.code-value{display:inline-block;max-width:100%;overflow-wrap:anywhere;font:700 16px/1.6 monospace;color:var(--cinnabar-dark);user-select:all}
.cloud-settings{padding:18px;margin-bottom:24px}.cloud-settings h2{font-size:19px;margin-bottom:8px}.cloud-settings form{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.cloud-settings input{flex:1;min-width:180px}
.wrong-card{padding:20px 22px;border:1px solid var(--line);border-radius:8px;background:var(--paper-raised)}
.wrong-card h2{font-size:19px;margin-bottom:6px}.wrong-card blockquote{margin:12px 0;padding:10px 14px;border-left:2px solid var(--gold);background:var(--paper);overflow-wrap:anywhere}
.wrong-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.sync-badge{font-size:12px;color:var(--muted)}
@media (max-width:1000px){
  .welcome-grid{gap:40px}.quiz-layout.graded{grid-template-columns:1fr}.result-panel{box-shadow:none}.question-row{grid-template-columns:42px minmax(0,1fr) auto 20px}
}
@media (max-width:720px){
  .shell{padding-inline:16px}.header-inner{min-height:66px;gap:8px}.brand-sub{display:none}.brand-name{font-size:16px}.brand-seal{width:36px;height:36px;font-size:21px}.header-actions{gap:2px}.nav-button{padding:8px;font-size:13px}.user-button{display:none}
  .view{padding-block:30px 44px}.welcome-grid{grid-template-columns:1fr;gap:32px;min-height:0}.hero-title{font-size:40px;max-width:none}.hero-copy{font-size:16px;margin-bottom:20px}.classic-quote{font-size:16px}.login-panel{padding:24px}.login-panel:after{right:18px;top:18px}
  .page-heading{align-items:flex-start;margin-bottom:24px}.page-heading h1{font-size:28px}.heading-note{display:none}.stats-grid{grid-template-columns:repeat(2,1fr)}.stat{padding:16px}.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1px solid var(--line)}.stat-value{font-size:28px}

}

<body>
<header class="site-header">
  <div class="shell header-inner">
    <button class="brand" type="button" data-action="home" aria-label="返回文言翻译研习首页">
      <span class="brand-seal" aria-hidden="true">译</span>
      <span><span class="brand-name">文言翻译研习</span><span class="brand-sub">字字落实 · 信达为要</span></span>
    </button>
    <nav class="header-actions" id="header-nav" aria-label="学习导航" hidden>
      <button class="nav-button" type="button" data-action="home" id="nav-home">题库</button>
      <button class="nav-button" type="button" data-action="wrongbook" id="nav-review">巩固包</button>
      <button class="text-button user-button" type="button" data-action="change-name" id="user-button" title="修改姓名"></button>
    </nav>
  </div>
</header>
<main id="app" class="shell"></main>
<footer class="site-footer">
  <div class="shell footer-inner"><span>文言翻译研习 · 配套学习资源</span><span>本地自评 · 可选 AI 批改与云端错题本</span></div>
</footer>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script type="module">
import { QUESTIONS } from './data/questions.js';
import { createLearner, gradeTranslation, getWrongbook, putWrongItem, deleteWrongItem, clearWrongbook } from './api.js';

'use strict';

const STORAGE_KEY = 'wenyan-fanyi-v1';
const iconOffline = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M5 12.5a7 7 0 0 1 12.6-4.2M19 11.5a7 7 0 0 1-12.6 4.2"/><path d="m3 3 18 18"/></svg>';


const defaultData = () => ({
  version:1,name:'',questions:{},learningCode:'',cloudStatus:'local',cloudInitialSyncDone:false,aiResults:{}
});
const validLearningCode = value => typeof value === 'string' && /^[A-Za-z0-9_-]{32,64}$/.test(value);
function validAiResult(result){
  return result && typeof result.score === 'number' && result.score >= 0 && result.score <= 10 &&
    typeof result.summary === 'string' && Array.isArray(result.points) && Array.isArray(result.errors) &&
    Array.isArray(result.suggestions) && typeof result.standardAnswer === 'string';
}
let storageWarning = '';
let data = defaultData();
try {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) {
    const parsed = JSON.parse(raw);
    if (!parsed || parsed.version !== 1 || typeof parsed.name !== 'string' || !parsed.questions || typeof parsed.questions !== 'object' || Array.isArray(parsed.questions)) throw new Error('invalid');
    data = {...defaultData(),name:parsed.name.slice(0,30)};
    data.learningCode = validLearningCode(parsed.learningCode) ? parsed.learningCode : '';
    data.cloudStatus = ['local','synced','offline'].includes(parsed.cloudStatus) ? parsed.cloudStatus : 'local';
    data.cloudInitialSyncDone = !!parsed.cloudInitialSyncDone;
    for (const q of QUESTIONS) {
      const r = parsed.questions[q.id];
      if (r && typeof r === 'object') {
        data.questions[q.id] = {
          attempts:Number.isInteger(r.attempts) && r.attempts >= 0 ? r.attempts : 0,
          correctAttempts:Number.isInteger(r.correctAttempts) && r.correctAttempts >= 0 ? r.correctAttempts : 0,
          needsReview:!!r.needsReview,mastered:!!r.mastered
        };
      }
      const saved = parsed.aiResults?.[q.id];
      if (saved && typeof saved.translation === 'string' && validAiResult(saved.result)) {
        data.aiResults[q.id] = {translation:saved.translation,result:saved.result};
      }
    }
  }
} catch (error) {
  try {
    const bad = localStorage.getItem(STORAGE_KEY);
    if (bad) localStorage.setItem('wenyan-fanyi-corrupt-backup',bad);
  } catch (_) {}
  data = defaultData();
  storageWarning = '本地记录无法读取，已使用新的临时学习记录。';
}

let view = 'welcome';
let currentId = null;
let revealed = false;
let marked = null;
let grading = false;
let gradingError = '';
let newCode = false;
let cloudLoading = false;
let cloudItems = [];
let cloudVersion = null;
let wrongbookError = '';
let learningCodePromise = null;
const drafts = {};
let toastTimer;
const app = document.getElementById('app');
const preferredScrollBehavior = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'instant' : 'smooth';

function esc(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function saveData(){
  try { localStorage.setItem(STORAGE_KEY,JSON.stringify(data)); }
  catch (_) { storageWarning='浏览器禁止本地存储，本次记录仅在当前页面有效。'; }
}
function showToast(message){
  const toast=document.getElementById('toast');toast.textContent=message;toast.hidden=false;
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{toast.hidden=true;},3200);
}
function recordFor(id){return data.questions[id]||{attempts:0,correctAttempts:0,needsReview:false,mastered:false};}
function stats(){
  const rows=Object.values(data.questions);
  const attempts=rows.reduce((n,r)=>n+r.attempts,0);
  const correct=rows.reduce((n,r)=>n+r.correctAttempts,0);
  return {attempts,correct,rate:attempts?Math.round(correct/attempts*100):0,review:rows.filter(r=>r.needsReview).length};
}
function splitPoints(text){
  return text.split('；').map(s=>s.trim()).filter(s=>s&&s!=='。').map(s=>s.replace(/。$/,''));
}
function noticeHtml(){return storageWarning?`<div class="storage-notice" role="status">${esc(storageWarning)}</div>`:'';}
function codeBannerHtml(){
  if(!newCode||!data.learningCode)return '';
  return `<section class="cloud-banner" role="status"><strong>请保存你的专属学习码</strong><p><code class="code-value">${esc(data.learningCode)}</code></p><button class="secondary-button" type="button" data-action="copy-code">复制学习码</button><p class="cloud-muted">它已保存在当前浏览器。其他设备可用它找回错题本；不要公开分享。</p></section>`;
}
function renderChrome(){
  const nav=document.getElementById('header-nav');nav.hidden=!data.name;
  document.getElementById('user-button').textContent=data.name?`${data.name} · 修改姓名`:'';
  document.getElementById('nav-home').classList.toggle('active',view==='home'||view==='quiz');
  document.getElementById('nav-review').classList.toggle('active',view==='wrongbook');
}
function setView(name,html){view=name;app.innerHTML=noticeHtml()+html;renderChrome();window.scrollTo({top:0,behavior:'instant'});}
function renderWelcome(){
  setView('welcome',`<section class="view welcome-grid">
    <div>
      <div class="eyebrow">文言文翻译训练</div>
      <h1 class="hero-title">落实每个<br><em>采分点</em>，译准每句话</h1>
      <p class="hero-copy">收录 2016—2026 年高考文言文翻译真题 79 道。先自行翻译原句，再对照参考译文、采分点解析与翻译方法——不仅知道怎么译，更知道为什么这样译。</p>
      <blockquote class="classic-quote">译事三难：信、达、雅。<small>—— 严复《天演论·译例言》</small></blockquote>
    </div>
    <section class="paper-panel login-panel" aria-labelledby="login-title">
      <div class="panel-kicker">79 道真题 · AI 可选</div>
      <h2 id="login-title">同学，如何称呼你？</h2>
      <p class="panel-copy">填写昵称后开始研习。自评“还需巩固”的题会收进个人巩固包。</p>
      <form id="name-form" novalidate>
        <label class="field-label" for="name-input">称呼（可使用昵称）</label>
        <input class="name-input" id="name-input" name="name" type="text" maxlength="30" autocomplete="nickname" placeholder="例如：小明" value="${esc(data.name)}" aria-describedby="name-error">
        <div class="field-error" id="name-error" role="alert"></div>
        <button class="primary-button full-width" type="submit">开始学习 <span aria-hidden="true">→</span></button>
      </form>
      <ul class="login-features">
        <li><span class="feature-number">一</span>79 道真题，覆盖 2016—2026 各卷</li>
        <li><span class="feature-number">二</span>参考译文配采分点与翻译方法</li>
        <li><span class="feature-number">三</span>可选 AI 批改与云端错题本</li>
      </ul>
      <div class="offline-note">${iconOffline}<span>题库和本地自评无需联网；使用 AI 或云端错题本时会连接服务。请勿输入真实姓名或其他个人信息。</span></div>
    </section>
  </section>`);
  document.getElementById('name-input').focus();
}
function statHtml(s){
  return `<div class="stats-grid" aria-label="学习统计">
    <div class="stat"><span class="stat-value">${s.attempts}</span><span class="stat-label">累计自评</span></div>
    <div class="stat"><span class="stat-value">${s.correct}</span><span class="stat-label">译对次数</span></div>
    <div class="stat"><span class="stat-value">${s.rate}%</span><span class="stat-label">译对率</span></div>
    <div class="stat"><span class="stat-value accent">${s.review}</span><span class="stat-label">待巩固题</span></div>
  </div>`;
}
function renderHome(){
  if(!data.name){renderWelcome();return;}
  const s=stats();
  const groups=[...new Set(QUESTIONS.map(q=>q.group))];
  const groupHtml=groups.map(group=>{
    const qs=QUESTIONS.filter(q=>q.group===group);
    const first=QUESTIONS.indexOf(qs[0])+1,last=QUESTIONS.indexOf(qs[qs.length-1])+1;
    const rows=qs.map(q=>{
      const r=recordFor(q.id);const idx=QUESTIONS.indexOf(q)+1;
      const status=r.needsReview?'<span class="status-badge review">待巩固</span>':r.attempts?'<span class="status-badge done">已掌握</span>':'<span class="status-badge">未作答</span>';
      return `<button class="question-row" type="button" data-action="open" data-id="${q.id}" aria-label="第 ${idx} 题，${esc(q.group)}${esc(q.source)}">
        <span class="question-number">${String(idx).padStart(2,'0')}</span>
        <span class="question-main"><strong>${esc(q.source)}</strong><small>${esc(q.original.slice(0,26))}…</small></span>${status}<span class="row-arrow" aria-hidden="true">›</span>
      </button>`;
    }).join('');
    return `<section class="group-section"><div class="group-heading"><h2>${esc(group)}</h2><span>第 ${first}—${last} 题 · 共 ${qs.length} 题</span></div><div class="question-list">${rows}</div></section>`;
  }).join('');
  setView('home',`<section class="view">
    <div class="page-heading"><div><h1>选择一题，开始研习</h1><p>${esc(data.name)}，每一处采分点都要有依据。</p></div><span class="heading-note">字字落实 · 句句贯通</span></div>
    ${statHtml(s)}
    <button class="review-entry" type="button" data-action="wrongbook"><span class="review-icon" aria-hidden="true">习</span><span class="review-text"><strong>我的巩固包</strong><small>${s.review?'待巩固题正在等你重新挑战':'当前没有待巩固题，保持这个节奏'}</small></span><span class="review-count">${s.review} 道</span><span aria-hidden="true">→</span></button>
    ${groupHtml}
  </section>`);
}
function aiResultHtml(q){
  const saved=data.aiResults[q.id];
  if(!saved)return '';
  const result=saved.result;
  const labels={correct:'译准',partial:'部分译出',missed:'遗漏或误译'};
  const points=result.points.map(point=>`<div class="marker-item"><span class="point-status ${esc(point.status)}">${labels[point.status]||'点评'}</span><strong>${esc(point.name)}</strong><p>${esc(point.evidence)}</p><p>${esc(point.feedback)}</p></div>`).join('');
  const errors=result.errors.length?result.errors.map(error=>`<div class="marker-item"><strong>${esc(error.category)}</strong>${esc(error.explanation)}</div>`).join(''):'<p>未发现明显错误，请继续对照采分点检查。</p>';
  return `<section class="ai-result" aria-labelledby="ai-result-title">
    <h2 id="ai-result-title" tabindex="-1">AI 批改结果</h2>
    <div class="score-line"><span class="score-value">${result.score}</span><span>/ 10 分 · 建议得分</span></div>
    <p class="ai-disclaimer">AI 评分仅供学习参考，不会覆盖你的自评统计。</p>
    <section class="analysis-section"><h3>总体评价</h3><p>${esc(result.summary)}</p></section>
    <section class="analysis-section"><h3>逐项采分点</h3><div class="marker-list">${points}</div></section>
    <section class="analysis-section"><h3>错误原因</h3><div class="marker-list">${errors}</div></section>
    <section class="analysis-section"><h3>修改建议</h3><ul>${result.suggestions.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></section>
    <button class="secondary-button" type="button" data-action="add-wrong">加入云端错题本</button>
  </section>`;
}
function answerHtml(q){
  const points=splitPoints(q.points).map(p=>`<div class="marker-item">${esc(p)}</div>`).join('');
  let assess='';
  if(marked===null){
    assess=`<div class="quiz-actions"><span class="quiz-hint">对照之后，给自己一个评价</span><span style="display:flex;gap:10px;flex-wrap:wrap"><button class="secondary-button" type="button" data-action="mark-wrong">还需巩固</button><button class="primary-button" type="button" data-action="mark-right">我译对了</button></span></div>`;
  }else{
    const ok=marked===true;
    const next=QUESTIONS[QUESTIONS.indexOf(q)+1];
    assess=`<div class="verdict ${ok?'':'wrong'}"><span class="verdict-mark" aria-hidden="true">${ok?'✓':'思'}</span><div><h2>${ok?'已记录：译对了':'已收入巩固包'}</h2><p>${ok?'继续保持，可以挑战下一题。':'稍后在巩固包里重新攻克它。'}</p></div></div>
    <div class="quiz-actions"><button class="secondary-button" type="button" data-action="home">返回题目列表</button>${next?`<button class="primary-button" type="button" data-action="open" data-id="${next.id}">下一题 →</button>`:''}</div>`;
  }
  return `${aiResultHtml(q)}<div class="verdict"><span class="verdict-mark" aria-hidden="true">译</span><div><h2>题库标准答案</h2><p>参考译文与采分点解析。</p></div></div>
    <div class="translation">${esc(q.translation)}</div>
    <section class="analysis-section"><h3>要点解析 · 采分点</h3><p class="analysis-intro">每个词落到实处的依据与推断方法。</p><div class="marker-list">${points}</div></section>
    <section class="analysis-section"><h3>翻译方法</h3><p class="analysis-intro">留、换、补、删、调、套、贯，看本题用了哪几招。</p><div class="marker-list"><div class="marker-item">${esc(q.methods)}</div></div></section>
    ${assess}`;
}
function renderQuiz(){
  const q=QUESTIONS.find(x=>x.id===currentId);if(!q){renderHome();return;}
  const idx=QUESTIONS.indexOf(q)+1;
  const draft=drafts[q.id]||'';
  setView('quiz',`<section class="view">
    <button class="back-button" type="button" data-action="home"><span aria-hidden="true">←</span> 返回题目列表</button>
    <div class="quiz-meta"><span class="quiz-number">第 ${idx} 题 / 共 ${QUESTIONS.length} 题</span><span>${esc(q.group)} · ${esc(q.source)}</span></div>
    <h1 class="quiz-title">${esc(q.group)} ${esc(q.source)}</h1>
    ${codeBannerHtml()}
    <div class="quiz-layout ${revealed?'graded':''}">
      <section class="paper-panel question-panel" aria-label="翻译原句">
        <div class="instruction"><span>先翻译下面的<strong>原句</strong>，再查看解析</span><span class="selection-count">翻译题</span></div>
        <div class="sentence" aria-label="文言原句">${esc(q.original)}</div>
        <form id="grade-form" novalidate>
          <label class="field-label" for="translation-input">我的译文</label>
          <textarea class="translation-input" id="translation-input" name="translation" aria-describedby="translation-count ai-error" aria-invalid="${gradingError?'true':'false'}" ${grading?'disabled':''}>${esc(draft)}</textarea>
          <div class="input-meta"><span id="translation-count">已输入 ${draft.length} / 2000 字符，至少 4 字符</span><span>10 分制建议评分</span></div>
          <p class="privacy-note">译文会发送给 AI 服务用于本次批改，请不要输入个人信息。</p>
          <div class="ai-error" id="ai-error" role="alert" ${gradingError?'':'hidden'}>${esc(gradingError)}</div>
          <div class="ai-actions"><button class="primary-button" id="grade-button" type="submit" ${grading?'disabled':''}>${grading?'AI 正在批改…':gradingError?'重试 AI 批改':'AI 批改'}</button><button class="secondary-button" type="button" data-action="reveal">只看参考答案</button></div>
          <div class="cloud-muted" role="status" aria-live="polite">${grading?'正在生成评分与逐项点评，请不要重复提交。':''}</div>
        </form>
      </section>
      ${revealed?`<aside class="result-panel" id="result-panel" aria-label="AI 批改与参考译文">${answerHtml(q)}</aside>`:''}
    </div>
  </section>`);
}
function openQuiz(id){
  currentId=id;revealed=!!data.aiResults[id];marked=null;gradingError='';renderQuiz();
}
function applyCloudBook(book){cloudItems=book.items;cloudVersion=book.version;data.cloudStatus='synced';saveData();}
async function ensureLearningCode(){
  if(data.learningCode)return data.learningCode;
  if(learningCodePromise)return learningCodePromise;
  learningCodePromise=(async()=>{
    const {learningCode}=await createLearner();
    data.learningCode=learningCode;newCode=true;data.cloudStatus='local';saveData();
    try { await syncExistingWrongItems(); }
    catch (_) { data.cloudStatus='local';saveData(); }
    return learningCode;
  })().finally(()=>{learningCodePromise=null;});
  return learningCodePromise;
}
async function syncExistingWrongItems(){
  if(data.cloudInitialSyncDone)return;
  for(const q of QUESTIONS){
    if(!recordFor(q.id).needsReview)continue;
    const saved=data.aiResults[q.id];
    const book=await putWrongItem(data.learningCode,q.id,{
      latestTranslation:drafts[q.id]||saved?.translation||'',lastScore:saved?.result.score??null,
      errorSummary:saved?.result.summary||'学生自评：还需巩固'
    },cloudVersion);
    applyCloudBook(book);
  }
  data.cloudInitialSyncDone=true;data.cloudStatus='synced';saveData();
}
async function gradeCurrent(){
  if(grading)return;
  const translation=(drafts[currentId]||'').trim();
  if(translation.length<4||translation.length>2000){
    gradingError=translation.length<4?'请至少输入 4 个字符的译文。':'译文不能超过 2000 个字符。';renderQuiz();
    document.getElementById('translation-input').focus();return;
  }
  if(data.aiResults[currentId]&&!window.confirm('再次提交会产生一次新的 AI 模型调用，是否继续？'))return;
  grading=true;gradingError='';renderQuiz();
  try{
    await ensureLearningCode();
    const result=await gradeTranslation({questionId:currentId,translation});
    data.aiResults[currentId]={translation,result};saveData();revealed=true;
  }catch(error){gradingError=error.message||'AI 批改失败，请稍后手动重试。';}
  grading=false;renderQuiz();
  if(!gradingError)requestAnimationFrame(()=>document.getElementById('ai-result-title')?.focus());
  else document.getElementById('translation-input')?.focus();
}
async function syncWrongItem(id){
  const saved=data.aiResults[id];
  data.cloudStatus='local';saveData();renderQuiz();
  try{
    await ensureLearningCode();
    const book=await putWrongItem(data.learningCode,id,{
      latestTranslation:drafts[id]||saved?.translation||'',lastScore:saved?.result.score??null,
      errorSummary:saved?.result.summary||'学生自评：还需巩固'
    },cloudVersion);
    applyCloudBook(book);showToast('已同步到云端错题本');
  }catch(error){data.cloudStatus='local';saveData();showToast(`已保存在本机，云端未同步：${error.message}`);}
  if(view==='quiz')renderQuiz();
}
function addCurrentWrong(){
  const r=recordFor(currentId);r.needsReview=true;r.mastered=false;data.questions[currentId]=r;saveData();
  syncWrongItem(currentId);
}
function formatDate(value){const date=new Date(value);return Number.isNaN(date.getTime())?'时间未知':date.toLocaleString('zh-CN');}
function cloudSettingsHtml(){
  const code=data.learningCode?`<p>学习码：<code class="code-value" id="learning-code">${esc(data.learningCode)}</code></p><button class="secondary-button" type="button" data-action="copy-code">复制学习码</button><p class="cloud-muted">不要公开分享学习码。其他设备可在下方输入它找回同一错题本。</p>`:'<p>尚未创建学习码，当前错题仅保存在本机。</p><button class="secondary-button" type="button" data-action="retry-cloud">创建学习码并同步</button>';
  return `<section class="paper-panel cloud-settings" aria-labelledby="cloud-settings-title"><h2 id="cloud-settings-title">云端错题本设置</h2>${code}<form id="recover-form"><label class="field-label" for="recover-code">找回其他设备的错题本</label><input class="name-input" id="recover-code" name="code" autocomplete="off" placeholder="输入学习码" required><button class="secondary-button" type="submit">找回错题本</button></form>${wrongbookError?`<div class="ai-error" role="alert">${esc(wrongbookError)} <button type="button" class="text-button" data-action="retry-cloud">重试</button></div>`:''}</section>`;
}
function renderWrongbook(){
  if(!data.name){renderWelcome();return;}
  const ids=new Set([...QUESTIONS.filter(q=>recordFor(q.id).needsReview).map(q=>q.id),...cloudItems.map(item=>item.questionId)]);
  const list=[...ids].map(id=>{
    const q=QUESTIONS.find(question=>question.id===id);if(!q)return '';
    const cloud=cloudItems.find(item=>item.questionId===id);const saved=data.aiResults[id];
    return `<article class="wrong-card"><div class="review-item-source">${esc(q.group)} · ${esc(q.source)}</div><h2>${esc(q.original)}</h2>
      ${cloud?`<blockquote>${esc(cloud.latestTranslation||'（未保存译文）')}</blockquote><p>建议分：${cloud.lastScore===null?'未批改':`${cloud.lastScore} / 10`} · 加入时间：${esc(formatDate(cloud.addedAt))}</p><p>主要错误：${esc(cloud.errorSummary||'无')}</p><span class="sync-badge">已同步</span>`:`<p>${esc(saved?.result.summary||'本地待巩固题')}</p><span class="sync-badge">仅保存在本机／未同步</span>`}
      <div class="wrong-actions"><button class="primary-button" type="button" data-action="open" data-id="${q.id}">重新作答</button><button class="secondary-button" type="button" data-action="master-wrong" data-id="${q.id}">标记已掌握</button><button class="text-button" type="button" data-action="delete-wrong" data-id="${q.id}">删除</button></div></article>`;
  }).join('');
  setView('wrongbook',`<section class="view">
    <button class="back-button" type="button" data-action="home"><span aria-hidden="true">←</span> 返回题目列表</button>
    <div class="page-heading"><div><h1>${esc(data.name)}的巩固包</h1><p>本地与云端错题集中复习，AI 分数不会替代你的自评。</p></div><span class="heading-note">温故而知新</span></div>
    ${codeBannerHtml()}${cloudSettingsHtml()}
    <div role="status" aria-live="polite" class="cloud-muted">${cloudLoading?'正在读取云端错题本…':''}</div>
    ${ids.size?`<div class="review-list">${list}</div><div class="wrong-actions"><button class="text-button" type="button" data-action="clear-wrongbook">清空错题本</button></div>`:`<div class="empty-state"><span class="empty-seal" aria-hidden="true">通</span><h2>当前没有待巩固题</h2><p>做过的题都已掌握。回到题库，继续挑战新的文本吧。</p><button class="primary-button" type="button" data-action="home">返回题库</button></div>`}
  </section>`);
}
async function openWrongbook(){
  renderWrongbook();cloudLoading=true;wrongbookError='';renderWrongbook();
  try{
    await ensureLearningCode();await syncExistingWrongItems();applyCloudBook(await getWrongbook(data.learningCode));
  }catch(error){data.cloudStatus='local';wrongbookError=error.message||'云端暂时不可用，本地记录仍可使用。';saveData();}
  cloudLoading=false;renderWrongbook();
}
async function removeWrongItem(id){
  const r=recordFor(id);r.needsReview=false;r.mastered=true;data.questions[id]=r;saveData();
  if(data.learningCode&&cloudItems.some(item=>item.questionId===id)){
    try{applyCloudBook(await deleteWrongItem(data.learningCode,id,cloudVersion));}
    catch(error){wrongbookError=`本地已更新，云端未同步：${error.message}`;}
  }
  renderWrongbook();
}
async function clearAllWrong(){
  if(!window.confirm('确定清空本地和云端错题本吗？此操作需要重新添加错题。'))return;
  for(const q of QUESTIONS){if(data.questions[q.id])data.questions[q.id].needsReview=false;}
  saveData();
  if(data.learningCode){try{applyCloudBook(await clearWrongbook(data.learningCode,cloudVersion));}catch(error){wrongbookError=`本地已清空，云端未同步：${error.message}`;}}
  renderWrongbook();
}
async function recoverWrongbook(code){
  const book=await getWrongbook(code);
  data.learningCode=code;data.cloudInitialSyncDone=true;newCode=false;applyCloudBook(book);wrongbookError='';renderWrongbook();
}

document.addEventListener('click',async event=>{
  const button=event.target.closest('[data-action]');if(!button)return;
  const action=button.dataset.action;
  if(action==='home')renderHome();
  else if(action==='wrongbook')await openWrongbook();
  else if(action==='open')openQuiz(button.dataset.id);
  else if(action==='reveal'){
    revealed=true;renderQuiz();
    requestAnimationFrame(()=>document.getElementById('result-panel')?.scrollIntoView({behavior:preferredScrollBehavior(),block:'start'}));
  }
  else if(action==='mark-right'||action==='mark-wrong'){
    const q=QUESTIONS.find(x=>x.id===currentId);if(!q||!revealed||marked!==null)return;
    const ok=action==='mark-right';marked=ok;const r=recordFor(q.id);
    r.attempts+=1;if(ok)r.correctAttempts+=1;r.needsReview=!ok;r.mastered=ok;
    data.questions[q.id]=r;saveData();renderQuiz();
    if(ok)showToast('已记录：译对了');else{showToast('已收入本机巩固包，正在尝试云端同步');await syncWrongItem(q.id);}
  }
  else if(action==='add-wrong')addCurrentWrong();
  else if(action==='copy-code'){
    try{await navigator.clipboard.writeText(data.learningCode);showToast('学习码已复制，请妥善保存');}
    catch(_){showToast('请选中学习码并手动复制');}
  }
  else if(action==='retry-cloud')await openWrongbook();
  else if(action==='delete-wrong'||action==='master-wrong')await removeWrongItem(button.dataset.id);
  else if(action==='clear-wrongbook')await clearAllWrong();
  else if(action==='change-name')renderWelcome();
});
document.addEventListener('submit',async event=>{
  event.preventDefault();
  if(event.target.id==='name-form'){
    const input=document.getElementById('name-input'),name=input.value.trim();
    if(!name){input.setAttribute('aria-invalid','true');document.getElementById('name-error').textContent='请先填写称呼';input.focus();return;}
    data.name=name;saveData();renderHome();
  }else if(event.target.id==='grade-form')await gradeCurrent();
  else if(event.target.id==='recover-form'){
    const input=document.getElementById('recover-code');
    try{await recoverWrongbook(input.value.trim());showToast('已找回云端错题本');}
    catch(error){wrongbookError=error.message||'找回失败，请检查学习码';renderWrongbook();input.focus();}
  }
});
document.addEventListener('input',event=>{
  if(event.target.id==='name-input'){event.target.removeAttribute('aria-invalid');document.getElementById('name-error').textContent='';}
  if(event.target.id==='translation-input'){
    drafts[currentId]=event.target.value;event.target.removeAttribute('aria-invalid');
    document.getElementById('translation-count').textContent=`已输入 ${event.target.value.length} / 2000 字符，至少 4 字符`;
  }
});

window.WenyanApp={getQuestions:()=>QUESTIONS,getState:()=>JSON.parse(JSON.stringify(data))};
renderWelcome();

</script>
</body>
</html>
